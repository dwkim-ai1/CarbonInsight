# .github/workflows/real_krx_collector.yml
name: 실시간 KRX ETS 데이터 수집

on:
  schedule:
    # 거래시간 중 실시간 수집 (10분마다)
    - cron: '*/10 1-3 * * 1-5'  # 10:00-12:00 KST (매 10분)
    # 장 마감 후 최종 수집
    - cron: '30 3 * * 1-5'      # 12:30 KST
    # 오후 확인 수집
    - cron: '0 6 * * 1-5'       # 15:00 KST
    
  workflow_dispatch:
    inputs:
      force_collection:
        description: '강제 수집 (거래시간 무시)'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: '디버그 모드 (상세 로그)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  collect-real-time-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: Python 환경 설정
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: 의존성 설치
      run: |
        echo "📦 필수 패키지 설치..."
        python -m pip install --upgrade pip
        
        # 필수 패키지 설치
        pip install requests==2.31.0
        pip install gspread==5.12.0
        pip install google-auth==2.23.4
        pip install google-auth-oauthlib==1.1.0
        pip install beautifulsoup4==4.12.2
        pip install lxml==4.9.3
        pip install pandas==2.1.3
        
        echo "✅ 패키지 설치 완료"
        
    - name: 시장 상태 및 거래시간 확인
      id: market_check
      run: |
        # 현재 시간 (KST)
        CURRENT_HOUR=$(TZ=Asia/Seoul date +%H)
        CURRENT_MINUTE=$(TZ=Asia/Seoul date +%M)
        CURRENT_TIME="${CURRENT_HOUR}:${CURRENT_MINUTE}"
        CURRENT_DAY=$(TZ=Asia/Seoul date +%u)
        CURRENT_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
        
        echo "current_time=${CURRENT_TIME}" >> $GITHUB_OUTPUT
        echo "current_hour=${CURRENT_HOUR}" >> $GITHUB_OUTPUT
        echo "current_date=${CURRENT_DATE}" >> $GITHUB_OUTPUT
        
        # 평일 여부
        IS_WEEKDAY="false"
        if [ "${CURRENT_DAY}" -le 5 ]; then
          IS_WEEKDAY="true"
        fi
        echo "is_weekday=${IS_WEEKDAY}" >> $GITHUB_OUTPUT
        
        # 거래시간 분석
        IS_TRADING_HOURS="false"
        MARKET_PHASE="closed"
        
        if [ "${IS_WEEKDAY}" = "true" ]; then
          if [ "${CURRENT_HOUR}" -ge 10 ] && [ "${CURRENT_HOUR}" -lt 12 ]; then
            IS_TRADING_HOURS="true"
            MARKET_PHASE="trading"
          elif [ "${CURRENT_HOUR}" -eq 12 ] && [ "${CURRENT_MINUTE}" -lt 30 ]; then
            MARKET_PHASE="just_closed"
          elif [ "${CURRENT_HOUR}" -eq 9 ]; then
            MARKET_PHASE="pre_trading"
          else
            MARKET_PHASE="post_trading"
          fi
        fi
        
        echo "is_trading_hours=${IS_TRADING_HOURS}" >> $GITHUB_OUTPUT
        echo "market_phase=${MARKET_PHASE}" >> $GITHUB_OUTPUT
        
        echo "🕐 현재 시간: ${CURRENT_TIME} KST"
        echo "📅 날짜: ${CURRENT_DATE}"
        echo "📊 시장 상태: ${MARKET_PHASE}"
        echo "💹 거래시간 여부: ${IS_TRADING_HOURS}"
        echo "📈 KRX 거래시간: 10:00-12:00 (평일)"
        
    - name: 실시간 데이터 수집 스크립트 생성
      env:
        DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
      run: |
        echo "📝 실시간 수집 스크립트 생성..."
        
        cat > real_krx_collector.py << 'EOF'
        #!/usr/bin/env python3
        """
        실시간 KRX ETS 데이터 수집기 - 정확한 웹사이트 데이터
        """
        
        import requests
        import gspread
        import json
        import os
        import logging
        import sys
        from datetime import datetime
        from typing import Dict, List, Optional
        import time
        import re
        from bs4 import BeautifulSoup
        
        # 디버그 모드 확인
        DEBUG_MODE = os.getenv('DEBUG_MODE', 'false').lower() == 'true'
        log_level = logging.DEBUG if DEBUG_MODE else logging.INFO
        
        logging.basicConfig(level=log_level, format='%(asctime)s - %(levelname)s - %(message)s')
        logger = logging.getLogger(__name__)
        
        class RealTimeKRXCollector:
            def __init__(self):
                self.session = requests.Session()
                self.session.headers.update({
                    'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36',
                    'Accept': 'text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8',
                    'Accept-Language': 'ko-KR,ko;q=0.9,en-US;q=0.8',
                    'Accept-Encoding': 'gzip, deflate, br',
                    'Connection': 'keep-alive',
                    'Cache-Control': 'no-cache',
                    'Pragma': 'no-cache'
                })
                
                self.base_url = "https://ets.krx.co.kr"
                
            def get_current_data(self) -> List[Dict]:
                """현재 실시간 데이터 수집"""
                try:
                    logger.info("=== 실시간 KRX ETS 데이터 수집 ===")
                    
                    # 1단계: 세션 초기화
                    main_url = f"{self.base_url}/contents/ETS/03/03010000/ETS03010000.jsp"
                    logger.info(f"메인 페이지 접속: {main_url}")
                    
                    response = self.session.get(main_url, timeout=30)
                    response.raise_for_status()
                    logger.info("메인 페이지 접속 성공")
                    
                    if DEBUG_MODE:
                        logger.debug(f"응답 헤더: {dict(response.headers)}")
                    
                    # 2단계: 데이터 요청
                    data_url = f"{self.base_url}/contents/ETS/03/03010000/ETS03010000M.jsp"
                    current_date = datetime.now().strftime('%Y%m%d')
                    
                    # 실제 KRX 사이트와 동일한 파라미터
                    post_data = {
                        'locale': 'ko_KR',
                        'searchDate': current_date,
                        'mktTpCd': '1',
                        'csvxls_isNo': 'false'
                    }
                    
                    headers = {
                        'Content-Type': 'application/x-www-form-urlencoded; charset=UTF-8',
                        'X-Requested-With': 'XMLHttpRequest',
                        'Referer': main_url,
                        'Origin': self.base_url
                    }
                    
                    logger.info(f"데이터 요청 - 날짜: {current_date}")
                    if DEBUG_MODE:
                        logger.debug(f"POST 데이터: {post_data}")
                    
                    response = self.session.post(
                        data_url, 
                        data=post_data, 
                        headers=headers,
                        timeout=30
                    )
                    response.raise_for_status()
                    
                    logger.info(f"데이터 응답 상태: {response.status_code}")
                    logger.info(f"응답 타입: {response.headers.get('content-type', 'unknown')}")
                    
                    # 응답 처리
                    content_type = response.headers.get('content-type', '').lower()
                    
                    if 'json' in content_type:
                        logger.info("JSON 응답 처리")
                        try:
                            json_data = response.json()
                            if DEBUG_MODE:
                                logger.debug(f"JSON 구조: {list(json_data.keys())}")
                            return self._parse_json_data(json_data)
                        except json.JSONDecodeError:
                            logger.warning("JSON 파싱 실패, HTML로 처리")
                            return self._parse_html_data(response.text)
                    else:
                        logger.info("HTML 응답 처리")
                        return self._parse_html_data(response.text)
                        
                except Exception as e:
                    logger.error(f"데이터 수집 실패: {e}")
                    if DEBUG_MODE:
                        logger.exception("상세 오류:")
                    return []
            
            def _parse_json_data(self, json_data: Dict) -> List[Dict]:
                """JSON 데이터 파싱"""
                try:
                    result = []
                    
                    # JSON 구조 분석
                    data_key = None
                    for key in ['result', 'data', 'list', 'items']:
                        if key in json_data and isinstance(json_data[key], list):
                            data_key = key
                            break
                    
                    if data_key:
                        data_list = json_data[data_key]
                        logger.info(f"JSON 데이터 배열 발견: {len(data_list)}개 항목")
                        
                        for item in data_list:
                            parsed = self._parse_item(item)
                            if parsed:
                                result.append(parsed)
                                
                    else:
                        logger.warning("JSON에서 데이터 배열을 찾을 수 없음")
                        if DEBUG_MODE:
                            logger.debug(f"JSON 전체 구조: {json_data}")
                    
                    logger.info(f"JSON 파싱 완료: {len(result)}개 종목")
                    return result
                    
                except Exception as e:
                    logger.error(f"JSON 파싱 오류: {e}")
                    return []
            
            def _parse_html_data(self, html_content: str) -> List[Dict]:
                """HTML 데이터 파싱"""
                try:
                    soup = BeautifulSoup(html_content, 'html.parser')
                    result = []
                    
                    # 테이블 찾기
                    table = soup.find('table') or soup.find('tbody')
                    
                    if not table:
                        logger.warning("HTML에서 테이블을 찾을 수 없음")
                        if DEBUG_MODE:
                            logger.debug(f"HTML 길이: {len(html_content)}")
                            logger.debug(f"HTML 샘플: {html_content[:500]}")
                        return []
                    
                    rows = table.find_all('tr')
                    logger.info(f"테이블 행 수: {len(rows)}")
                    
                    # 헤더 건너뛰고 데이터 행 처리
                    for i, row in enumerate(rows[1:] if len(rows) > 1 else rows):
                        try:
                            cells = row.find_all(['td', 'th'])
                            if len(cells) >= 3:  # 최소한의 데이터가 있는 행
                                parsed = self._parse_row(cells)
                                if parsed:
                                    result.append(parsed)
                                    if DEBUG_MODE:
                                        logger.debug(f"행 {i+1} 파싱: {parsed['symbol']}")
                        except Exception as e:
                            logger.warning(f"행 {i+1} 파싱 실패: {e}")
                    
                    logger.info(f"HTML 파싱 완료: {len(result)}개 종목")
                    return result
                    
                except Exception as e:
                    logger.error(f"HTML 파싱 오류: {e}")
                    return []
            
            def _parse_item(self, item: Dict) -> Optional[Dict]:
                """개별 아이템 파싱 (JSON)"""
                try:
                    # 다양한 필드명 매핑
                    symbol = item.get('itemCd') or item.get('symbol') or item.get('code')
                    name = item.get('itemNm') or item.get('name')
                    
                    if not symbol and not name:
                        return None
                    
                    return {
                        'date': datetime.now().strftime('%Y-%m-%d'),
                        'symbol': str(symbol or name).strip(),
                        'current_price': self._safe_float(item.get('currentPrice', 0)),
                        'change': self._safe_float(item.get('change', 0)),
                        'change_rate': self._safe_float(item.get('changeRate', 0)),
                        'open_price': self._safe_float(item.get('openPrice', 0)),
                        'high_price': self._safe_float(item.get('highPrice', 0)),
                        'low_price': self._safe_float(item.get('lowPrice', 0)),
                        'volume': self._safe_float(item.get('volume', 0)),
                        'trading_value': self._safe_float(item.get('tradingValue', 0)),
                        'weighted_avg': self._safe_float(item.get('weightedAvg', 0)),
                        'collection_time': datetime.now().strftime('%H:%M:%S'),
                        'data_source': 'krx_realtime'
                    }
                    
                except Exception as e:
                    logger.warning(f"아이템 파싱 실패: {e}")
                    return None
            
            def _parse_row(self, cells: List) -> Optional[Dict]:
                """테이블 행 파싱 (HTML)"""
                try:
                    cell_texts = [cell.get_text(strip=True) for cell in cells]
                    
                    if len(cell_texts) < 3 or not cell_texts[0]:
                        return None
                    
                    symbol = cell_texts[0]
                    if symbol == '-' or not symbol:
                        return None
                    
                    return {
                        'date': datetime.now().strftime('%Y-%m-%d'),
                        'symbol': symbol,
                        'current_price': self._extract_number(cell_texts[1] if len(cell_texts) > 1 else '0'),
                        'change': self._extract_number(cell_texts[2] if len(cell_texts) > 2 else '0'),
                        'change_rate': self._extract_number(cell_texts[3] if len(cell_texts) > 3 else '0'),
                        'open_price': self._extract_number(cell_texts[4] if len(cell_texts) > 4 else '0'),
                        'high_price': self._extract_number(cell_texts[5] if len(cell_texts) > 5 else '0'),
                        'low_price': self._extract_number(cell_texts[6] if len(cell_texts) > 6 else '0'),
                        'volume': self._extract_number(cell_texts[7] if len(cell_texts) > 7 else '0'),
                        'trading_value': self._extract_number(cell_texts[8] if len(cell_texts) > 8 else '0'),
                        'weighted_avg': self._extract_number(cell_texts[9] if len(cell_texts) > 9 else '0'),
                        'collection_time': datetime.now().strftime('%H:%M:%S'),
                        'data_source': 'krx_realtime_html'
                    }
                    
                except Exception as e:
                    logger.warning(f"행 파싱 실패: {e}")
                    return None
            
            def _safe_float(self, value) -> float:
                """안전한 float 변환"""
                try:
                    if value is None:
                        return 0.0
                    if isinstance(value, (int, float)):
                        return float(value)
                    if isinstance(value, str):
                        cleaned = re.sub(r'[^\d.-]', '', value.replace(',', ''))
                        return float(cleaned) if cleaned else 0.0
                    return 0.0
                except:
                    return 0.0
            
            def _extract_number(self, text: str) -> float:
                """텍스트에서 숫자 추출"""
                try:
                    if not text or text in ['-', '']:
                        return 0.0
                    cleaned = re.sub(r'[^\d.-]', '', text.replace(',', ''))
                    return float(cleaned) if cleaned else 0.0
                except:
                    return 0.0
        
        class GoogleSheetsUpdater:
            def __init__(self, credentials_json: str, sheet_id: str):
                try:
                    creds_dict = json.loads(credentials_json)
                    self.gc = gspread.service_account_from_dict(creds_dict)
                    self.sheet_id = sheet_id
                    
                    self.spreadsheet = self.gc.open_by_key(sheet_id)
                    logger.info(f"스프레드시트 연결: {self.spreadsheet.title}")
                    
                    self._setup_worksheet()
                    
                except Exception as e:
                    logger.error(f"Google Sheets 연결 실패: {e}")
                    raise
            
            def _setup_worksheet(self):
                try:
                    try:
                        self.worksheet = self.spreadsheet.worksheet('ets.KRX')
                        logger.info("기존 워크시트 사용")
                    except gspread.WorksheetNotFound:
                        self.worksheet = self.spreadsheet.add_worksheet(
                            title='ets.KRX', rows=1000, cols=13
                        )
                        
                        headers = [
                            '날짜', '종목명', '현재가', '대비', '등락률',
                            '시가', '고가', '저가', '거래량', '거래대금',
                            '가중평균', '수집시간', '데이터소스'
                        ]
                        self.worksheet.update('A1:M1', [headers])
                        
                        # 헤더 서식
                        self.worksheet.format('A1:M1', {
                            'backgroundColor': {'red': 0.1, 'green': 0.5, 'blue': 0.8},
                            'textFormat': {'bold': True, 'foregroundColor': {'red': 1, 'green': 1, 'blue': 1}},
                            'horizontalAlignment': 'CENTER'
                        })
                        
                        logger.info("새 워크시트 생성 완료")
                        
                except Exception as e:
                    logger.error(f"워크시트 설정 실패: {e}")
                    raise
            
            def update_realtime_data(self, data: List[Dict]) -> bool:
                try:
                    if not data:
                        logger.warning("업데이트할 데이터 없음")
                        return False
                    
                    current_date = data[0]['date']
                    logger.info(f"실시간 데이터 업데이트: {current_date}, {len(data)}개 종목")
                    
                    # 기존 오늘 데이터 삭제
                    all_values = self.worksheet.get_all_values()
                    rows_to_delete = []
                    
                    for i, row in enumerate(all_values[1:], start=2):
                        if len(row) > 0 and row[0] == current_date:
                            rows_to_delete.append(i)
                    
                    if rows_to_delete:
                        logger.info(f"기존 {len(rows_to_delete)}개 행 삭제")
                        for row_num in reversed(rows_to_delete):
                            self.worksheet.delete_rows(row_num)
                    
                    # 새 데이터 추가
                    new_rows = []
                    for item in data:
                        row = [
                            item['date'], item['symbol'], item['current_price'],
                            item['change'], item['change_rate'], item['open_price'],
                            item['high_price'], item['low_price'], item['volume'],
                            item['trading_value'], item['weighted_avg'],
                            item['collection_time'], item['data_source']
                        ]
                        new_rows.append(row)
                    
                    if new_rows:
                        self.worksheet.append_rows(new_rows)
                        logger.info(f"{len(new_rows)}개 행 추가")
                        
                        # 형식 적용
                        self._apply_formatting()
                        
                        return True
                    
                    return False
                    
                except Exception as e:
                    logger.error(f"데이터 업데이트 실패: {e}")
                    return False
            
            def _apply_formatting(self):
                try:
                    last_row = len(self.worksheet.get_all_values())
                    if last_row <= 1:
                        return
                    
                    # 숫자 형식
                    number_format = {'numberFormat': {'type': 'NUMBER', 'pattern': '#,##0'}}
                    for col in ['C', 'D', 'F', 'G', 'H', 'I', 'J', 'K']:
                        self.worksheet.format(f'{col}2:{col}{last_row}', number_format)
                    
                    # 등락률 형식
                    self.worksheet.format(f'E2:E{last_row}', {
                        'numberFormat': {'type': 'NUMBER', 'pattern': '0.00%'}
                    })
                    
                    logger.info("형식 적용 완료")
                    
                except Exception as e:
                    logger.warning(f"형식 적용 오류: {e}")
        
        def main():
            try:
                logger.info("=== 실시간 KRX ETS 데이터 수집 시작 ===")
                
                # 환경변수 확인
                creds_json = os.getenv('GOOGLE_SHEETS_CREDS')
                sheet_id = os.getenv('KAU_SHEET_ID')
                market_phase = os.getenv('MARKET_PHASE', 'unknown')
                
                if not creds_json or not sheet_id:
                    raise ValueError("필수 환경변수 누락")
                
                logger.info(f"시장 단계: {market_phase}")
                
                # 실시간 데이터 수집
                collector = RealTimeKRXCollector()
                data = collector.get_current_data()
                
                if data:
                    # Google Sheets 업데이트
                    updater = GoogleSheetsUpdater(creds_json, sheet_id)
                    success = updater.update_realtime_data(data)
                    
                    if success:
                        # 결과 출력
                        total_volume = sum(item['volume'] for item in data)
                        active_count = len([item for item in data if item['volume'] > 0])
                        
                        print(f"✅ 실시간 수집 성공!")
                        print(f"📊 총 종목: {len(data)}개")
                        print(f"🔥 활성 종목: {active_count}개")
                        print(f"📈 총 거래량: {total_volume:,} 톤")
                        print(f"🕐 수집시간: {datetime.now().strftime('%H:%M:%S')} KST")
                        
                        # 주요 종목 표시
                        active_data = [d for d in data if d['volume'] > 0]
                        if active_data:
                            print("\n📋 활성 거래 종목:")
                            for item in active_data[:3]:
                                print(f"  • {item['symbol']}: {item['current_price']:,}원 "
                                      f"({item['change']:+.0f}) 거래량: {item['volume']:,}톤")
                        
                        logger.info("✅ 실시간 데이터 업데이트 완료")
                    else:
                        logger.error("❌ 업데이트 실패")
                        sys.exit(1)
                else:
                    logger.error("❌ 데이터 수집 실패")
                    sys.exit(1)
                    
            except Exception as e:
                logger.error(f"❌ 실행 오류: {e}")
                if DEBUG_MODE:
                    logger.exception("상세 오류:")
                sys.exit(1)
        
        if __name__ == "__main__":
            main()
        EOF
        
        echo "✅ 실시간 수집 스크립트 생성 완료"
        
    - name: 환경변수 검증
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
      run: |
        echo "🔍 환경변수 검증..."
        
        if [ -z "$GOOGLE_SHEETS_CREDS" ]; then
          echo "❌ GOOGLE_SHEETS_CREDS 누락"
          exit 1
        else
          echo "✅ GOOGLE_SHEETS_CREDS 확인 (${#GOOGLE_SHEETS_CREDS} chars)"
        fi
        
        if [ -z "$KAU_SHEET_ID" ]; then
          echo "❌ KAU_SHEET_ID 누락"
          exit 1
        else
          echo "✅ KAU_SHEET_ID: $KAU_SHEET_ID"
        fi
        
    - name: 실시간 데이터 수집 실행
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        MARKET_PHASE: ${{ steps.market_check.outputs.market_phase }}
        DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
      run: |
        echo "🚀 실시간 KRX 데이터 수집 시작..."
        echo "📊 시장 단계: ${{ steps.market_check.outputs.market_phase }}"
        echo "⏰ 현재 시간: ${{ steps.market_check.outputs.current_time }} KST"
        echo "💹 거래시간: ${{ steps.market_check.outputs.is_trading_hours }}"
        
        # 주말 체크
        if [ "${{ steps.market_check.outputs.is_weekday }}" = "false" ]; then
          echo "📅 주말이므로 수집 건너뜀"
          exit 0
        fi
        
        # 강제 수집이 아닌 경우 거래시간 확인
        if [ "${{ github.event.inputs.force_collection }}" != "true" ]; then
          case "${{ steps.market_check.outputs.market_phase }}" in
            "closed")
              echo "🔒 시장 마감 - 수집 건너뜀"
              exit 0
              ;;
            "trading"|"just_closed"|"post_trading")
              echo "📈 수집 진행..."
              ;;
            *)
              echo "⏰ 거래시간 외 - 제한적 수집"
              ;;
          esac
        else
          echo "🔧 강제 수집 모드"
        fi
        
        # 실시간 수집 실행
        python real_krx_collector.py
        
    - name: 수집 결과 분석 및 요약
      if: always()
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
      run: |
        echo "📊 수집 결과 분석 중..."
        
        python -c "
        import gspread
        import json
        import os
        from datetime import datetime
        
        try:
            creds = json.loads(os.environ['GOOGLE_SHEETS_CREDS'])
            gc = gspread.service_account_from_dict(creds)
            sheet = gc.open_by_key(os.environ['KAU_SHEET_ID']).worksheet('ets.KRX')
            
            # 오늘 데이터 확인
            today = datetime.now().strftime('%Y-%m-%d')
            all_data = sheet.get_all_records()
            today_data = [r for r in all_data if r.get('날짜') == today]
            
            if today_data:
                print(f'📈 오늘({today}) 수집 결과:')
                print(f'  • 총 종목: {len(today_data)}개')
                
                # 활성 거래 분석
                active = [r for r in today_data if int(str(r.get('거래량', 0)).replace(',', '') or 0) > 0]
                print(f'  • 활성 거래: {len(active)}개')
                
                if active:
                    total_vol = sum(int(str(r.get('거래량', 0)).replace(',', '') or 0) for r in active)
                    avg_price = sum(float(str(r.get('현재가', 0)).replace(',', '') or 0) for r in active) / len(active)
                    print(f'  • 총 거래량: {total_vol:,} 톤')
                    print(f'  • 평균 가격: {avg_price:,.0f} 원')
                    
                    # 상위 거래량 종목
                    sorted_active = sorted(active, key=lambda x: int(str(x.get('거래량', 0)).replace(',', '') or 0), reverse=True)
                    print(f'  • 최대 거래량: {sorted_active[0].get(\"종목명\")} ({int(str(sorted_active[0].get(\"거래량\", 0)).replace(\",\", \") or 0):,}톤)')
                
                latest_time = today_data[-1].get('수집시간', 'Unknown')
                print(f'  • 최종 수집: {latest_time}')
                
            else:
                print(f'⚠️ 오늘({today}) 데이터 없음')
                
        except Exception as e:
            print(f'❌ 분석 실패: {e}')
        "
        
    - name: 실행 결과 요약
      if: always()
      run: |
        echo "## 🚀 실시간 KRX ETS 수집 결과" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**실행 시간**: ${{ steps.market_check.outputs.current_time }} KST" >> $GITHUB_STEP_SUMMARY
        echo "**날짜**: ${{ steps.market_check.outputs.current_date }}" >> $GITHUB_STEP_SUMMARY
        echo "**시장 상태**: ${{ steps.market_check.outputs.market_phase }}" >> $GITHUB_STEP_SUMMARY
        echo "**거래시간**: ${{ steps.market_check.outputs.is_trading_hours }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ $? -eq 0 ]; then
          echo "**결과**: ✅ 성공" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📈 거래시간 정보" >> $GITHUB_STEP_SUMMARY
          echo "- **매매거래**: 10:00-12:00 KST" >> $GITHUB_STEP_SUMMARY
          echo "- **호가접수**: 09:00-12:00 KST" >> $GITHUB_STEP_SUMMARY
          echo "- **수집 주기**: 거래시간 중 10분마다" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 다음 수집" >> $GITHUB_STEP_SUMMARY
          
          case "${{ steps.market_check.outputs.market_phase }}" in
            "trading")
              echo "- **10분 후**: 실시간 업데이트" >> $GITHUB_STEP_SUMMARY
              echo "- **12:30**: 장 마감 후 최종 수집" >> $GITHUB_STEP_SUMMARY
              ;;
            "just_closed")
              echo "- **15:00**: 오후 확인 수집" >> $GITHUB_STEP_SUMMARY
              ;;
            *)
              echo "- **내일 10:00**: 다음 거래시간" >> $GITHUB_STEP_SUMMARY
              ;;
          esac
          
        else
          echo "**결과**: ❌ 실패" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔧 확인 필요" >> $GITHUB_STEP_SUMMARY
          echo "- KRX 웹사이트 접근 상태" >> $GITHUB_STEP_SUMMARY
          echo "- 네트워크 연결 상태" >> $GITHUB_STEP_SUMMARY
          echo "- Google Sheets API 할당량" >> $GITHUB_STEP_SUMMARY
        fi
        
        # 알림 메시지
        if [ $? -eq 0 ]; then
          echo "::notice::✅ 실시간 KRX 데이터 수집 성공!"
        else
          echo "::warning::❌ 실시간 KRX 데이터 수집 실패"
        fi
