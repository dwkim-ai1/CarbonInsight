# .github/workflows/KAU_price_collector.yml
# 모든 Deprecated 오류 수정 + 안정성 강화 버전

name: KRX ETS Data Collector

on:
  schedule:
    # KST 09:00-12:00 (10분 간격) = UTC 00:00-03:00
    # 한국 배출권 거래시간 최적화 (총 19회 실행/일)
    
    # 09:00-09:50 (주문접수 - 단일가 매매)
    - cron: '0 0 * * 1-5'     # KST 09:00
    - cron: '10 0 * * 1-5'    # KST 09:10
    - cron: '20 0 * * 1-5'    # KST 09:20
    - cron: '30 0 * * 1-5'    # KST 09:30
    - cron: '40 0 * * 1-5'    # KST 09:40
    - cron: '50 0 * * 1-5'    # KST 09:50
    
    # 10:00-10:50 (시가 체결 + 실시간 거래)
    - cron: '0 1 * * 1-5'     # KST 10:00 ⭐ 시가 체결
    - cron: '10 1 * * 1-5'    # KST 10:10
    - cron: '20 1 * * 1-5'    # KST 10:20
    - cron: '30 1 * * 1-5'    # KST 10:30
    - cron: '40 1 * * 1-5'    # KST 10:40
    - cron: '50 1 * * 1-5'    # KST 10:50
    
    # 11:00-11:50 (실시간 거래 + 종가 준비)
    - cron: '0 2 * * 1-5'     # KST 11:00
    - cron: '10 2 * * 1-5'    # KST 11:10
    - cron: '20 2 * * 1-5'    # KST 11:20
    - cron: '30 2 * * 1-5'    # KST 11:30 ⭐ 종가 준비
    - cron: '40 2 * * 1-5'    # KST 11:40
    - cron: '50 2 * * 1-5'    # KST 11:50
    
    # 12:00 (종가 체결)
    - cron: '0 3 * * 1-5'     # KST 12:00 ⭐⭐ 종가 체결
    
    # 15:00 (일일 요약)
    - cron: '0 6 * * 1-5'     # KST 15:00 📊 일일 요약
    
  workflow_dispatch:
    inputs:
      force_collection:
        description: '강제 수집 (거래시간 무시)'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: '디버그 모드 활성화'
        required: false
        default: false
        type: boolean
      test_mode:
        description: '테스트 모드 (실제 업데이트 없음)'
        required: false
        default: false
        type: boolean
      send_telegram:
        description: '텔레그램 요약 강제 전송'
        required: false
        default: false
        type: boolean

# 필요한 최소 권한만 부여 (보안 강화)
permissions:
  contents: read
  actions: write

env:
  # 전역 시간대 설정
  TZ: Asia/Seoul
  # Python 버전 통일
  PYTHON_VERSION: '3.9'

jobs:
  # Job 1: 거래 조건 확인 (초경량)
  check-trading-conditions:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      current_time: ${{ steps.check.outputs.current_time }}
      current_kst: ${{ steps.check.outputs.current_kst }}
      market_phase: ${{ steps.check.outputs.market_phase }}
      trading_phase: ${{ steps.check.outputs.trading_phase }}
      is_daily_summary: ${{ steps.check.outputs.is_daily_summary }}
      execution_priority: ${{ steps.check.outputs.execution_priority }}
      
    steps:
    - name: 거래시간 및 실행 조건 분석
      id: check
      run: |
        echo "=== 한국 배출권 거래시간 분석 ($(date '+%Y-%m-%d %H:%M:%S') KST) ==="
        
        # 현재 시간 정보
        CURRENT_HOUR=$(date +%H)
        CURRENT_MINUTE=$(date +%M)
        CURRENT_TIME="${CURRENT_HOUR}:${CURRENT_MINUTE}"
        CURRENT_DAY=$(date +%u)
        CURRENT_KST=$(date '+%Y-%m-%d %H:%M:%S')
        
        echo "📅 현재: ${CURRENT_KST} KST"
        echo "📊 요일: ${CURRENT_DAY} (1=월, 5=금)"
        
        # 출력 변수 설정
        echo "current_time=${CURRENT_TIME}" >> $GITHUB_OUTPUT
        echo "current_kst=${CURRENT_KST}" >> $GITHUB_OUTPUT
        
        # 거래일 확인
        IS_TRADING_DAY="false"
        if [ "${CURRENT_DAY}" -le 5 ]; then
          IS_TRADING_DAY="true"
        fi
        
        # 실행 조건 분석
        SHOULD_RUN="false"
        MARKET_PHASE="market_closed"
        TRADING_PHASE="none"
        EXECUTION_PRIORITY="low"
        IS_DAILY_SUMMARY="false"
        
        if [ "${IS_TRADING_DAY}" = "true" ]; then
          case "${CURRENT_HOUR}" in
            09)
              SHOULD_RUN="true"
              MARKET_PHASE="pre_trading"
              TRADING_PHASE="order_acceptance"
              EXECUTION_PRIORITY="medium"
              echo "📝 주문접수 시간 (단일가 매매 준비)"
              ;;
            10)
              SHOULD_RUN="true"
              MARKET_PHASE="active_trading"
              if [ "${CURRENT_MINUTE}" -eq 0 ]; then
                TRADING_PHASE="opening_price_decision"
                EXECUTION_PRIORITY="critical"
                echo "🔥 시가 체결 시점 - 최우선"
              else
                TRADING_PHASE="real_time_trading"
                EXECUTION_PRIORITY="high"
                echo "⚡ 실시간 복수가격 매매"
              fi
              ;;
            11)
              SHOULD_RUN="true"
              MARKET_PHASE="active_trading"
              if [ "${CURRENT_MINUTE}" -lt 30 ]; then
                TRADING_PHASE="real_time_trading"
                EXECUTION_PRIORITY="high"
                echo "⚡ 실시간 복수가격 매매"
              else
                TRADING_PHASE="closing_preparation"
                EXECUTION_PRIORITY="high"
                echo "📊 종가 준비 (단일가 매매)"
              fi
              ;;
            12)
              if [ "${CURRENT_MINUTE}" -eq 0 ]; then
                SHOULD_RUN="true"
                MARKET_PHASE="market_close"
                TRADING_PHASE="closing_price_decision"
                EXECUTION_PRIORITY="critical"
                echo "🏁 종가 체결 시점 - 최우선"
              else
                MARKET_PHASE="post_trading"
                TRADING_PHASE="market_closed"
                echo "📋 거래 종료"
              fi
              ;;
            15)
              SHOULD_RUN="true"
              MARKET_PHASE="daily_summary"
              TRADING_PHASE="analysis_time"
              EXECUTION_PRIORITY="medium"
              IS_DAILY_SUMMARY="true"
              echo "📊 일일 요약 시간"
              ;;
            *)
              echo "⏸️ 거래시간 외"
              ;;
          esac
        else
          echo "⏸️ 주말/공휴일"
        fi
        
        # 수동 실행 처리
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          SHOULD_RUN="true"
          MARKET_PHASE="manual_execution"
          TRADING_PHASE="manual"
          EXECUTION_PRIORITY="high"
          echo "🔧 수동 실행 - 강제 수집"
        fi
        
        # 출력 설정
        echo "should_run=${SHOULD_RUN}" >> $GITHUB_OUTPUT
        echo "market_phase=${MARKET_PHASE}" >> $GITHUB_OUTPUT
        echo "trading_phase=${TRADING_PHASE}" >> $GITHUB_OUTPUT
        echo "is_daily_summary=${IS_DAILY_SUMMARY}" >> $GITHUB_OUTPUT
        echo "execution_priority=${EXECUTION_PRIORITY}" >> $GITHUB_OUTPUT
        
        echo ""
        echo "=== 실행 결정 ==="
        echo "✅ 실행: ${SHOULD_RUN}"
        echo "📈 시장: ${MARKET_PHASE}"
        echo "⚡ 거래: ${TRADING_PHASE}"
        echo "🎯 우선도: ${EXECUTION_PRIORITY}"
        echo "📱 일일요약: ${IS_DAILY_SUMMARY}"

  # Job 2: 데이터 수집 (조건부 실행)
  collect-krx-data:
    needs: check-trading-conditions
    runs-on: ubuntu-latest
    if: needs.check-trading-conditions.outputs.should_run == 'true'
    
    # 타임아웃 설정 (최대 10분)
    timeout-minutes: 10
    
    outputs:
      collection_status: ${{ steps.collection.outputs.status }}
      collection_message: ${{ steps.collection.outputs.message }}
      data_quality: ${{ steps.collection.outputs.data_quality }}
      
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: Python 환경 설정 (최신 버전)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: 의존성 설치 (캐시 최적화)
      run: |
        echo "⚡ Python ${{ env.PYTHON_VERSION }} 환경 설정"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ 패키지 설치 완료"
        
    - name: 환경변수 검증 (보안 강화)
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
      run: |
        echo "=== 필수 환경변수 검증 ==="
        
        ERROR_COUNT=0
        
        if [ -z "$GOOGLE_SHEETS_CREDS" ]; then
          echo "❌ CRITICAL: GOOGLE_SHEETS_CREDS 누락"
          ERROR_COUNT=$((ERROR_COUNT + 1))
        else
          echo "✅ GOOGLE_SHEETS_CREDS: OK (${#GOOGLE_SHEETS_CREDS} chars)"
        fi
        
        if [ -z "$KAU_SHEET_ID" ]; then
          echo "❌ CRITICAL: KAU_SHEET_ID 누락"
          ERROR_COUNT=$((ERROR_COUNT + 1))
        else
          echo "✅ KAU_SHEET_ID: OK ($KAU_SHEET_ID)"
        fi
        
        if [ $ERROR_COUNT -gt 0 ]; then
          echo "❌ 필수 환경변수 ${ERROR_COUNT}개 누락!"
          echo "💡 GitHub Settings → Secrets and variables → Actions 확인"
          exit 1
        fi
        
        echo "✅ 모든 필수 환경변수 확인됨"

    - name: KRX 데이터 수집 실행
      id: collection
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        MARKET_PHASE: ${{ needs.check-trading-conditions.outputs.market_phase }}
        TRADING_PHASE: ${{ needs.check-trading-conditions.outputs.trading_phase }}
        EXECUTION_PRIORITY: ${{ needs.check-trading-conditions.outputs.execution_priority }}
        CURRENT_KST: ${{ needs.check-trading-conditions.outputs.current_kst }}
        DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
        TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
      run: |
        echo "=== KRX 배출권 데이터 수집 시작 ==="
        echo "📊 시장: ${MARKET_PHASE}"
        echo "⚡ 거래: ${TRADING_PHASE}"
        echo "🎯 우선도: ${EXECUTION_PRIORITY}"
        echo "⏰ 시간: ${CURRENT_KST} KST"
        echo "🔧 디버그: ${DEBUG_MODE}"
        echo "🧪 테스트: ${TEST_MODE}"
        
        # 시작 시간 기록
        START_TIME=$(date +%s)
        
        # 거래 단계별 환경변수 설정
        case "${TRADING_PHASE}" in
          "opening_price_decision"|"closing_price_decision")
            echo "🔥 중요 시점 - 고정밀 모드"
            export HIGH_ACCURACY_MODE=true
            export MAX_RETRIES=5
            ;;
          "real_time_trading")
            echo "⚡ 실시간 거래 - 고속 모드"
            export FAST_UPDATE_MODE=true
            export MAX_RETRIES=3
            ;;
          *)
            echo "📋 표준 모드"
            export MAX_RETRIES=2
            ;;
        esac
        
        # Python 스크립트 실행
        echo "🚀 데이터 수집 스크립트 실행..."
        
        if python KAU_price_collector.py; then
          # 성공 처리
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message=데이터 수집 성공 (${DURATION}초, ${TRADING_PHASE})" >> $GITHUB_OUTPUT
          echo "data_quality=high" >> $GITHUB_OUTPUT
          
          echo "✅ 데이터 수집 성공!"
          echo "⏱️ 실행 시간: ${DURATION}초"
          
          # 거래 단계별 성공 메시지
          case "${TRADING_PHASE}" in
            "opening_price_decision")
              echo "🎉 시가 데이터 수집 완료!"
              echo "::notice::🔥 시가 체결 데이터 수집 성공"
              ;;
            "closing_price_decision")
              echo "🎉 종가 데이터 수집 완료!"
              echo "::notice::🏁 종가 체결 데이터 수집 성공"
              ;;
            "real_time_trading")
              echo "⚡ 실시간 거래 데이터 업데이트!"
              ;;
            "analysis_time")
              echo "📊 일일 요약 데이터 수집 완료!"
              ;;
          esac
          
        else
          # 실패 처리
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "message=데이터 수집 실패 (${DURATION}초, ${TRADING_PHASE})" >> $GITHUB_OUTPUT
          echo "data_quality=failed" >> $GITHUB_OUTPUT
          
          echo "❌ 데이터 수집 실패!"
          echo "⏱️ 실행 시간: ${DURATION}초"
          
          # 중요 시점 실패는 심각하게 처리
          if [ "${EXECUTION_PRIORITY}" = "critical" ]; then
            echo "🚨 CRITICAL: 중요 거래 시점 실패!"
            echo "::error::🚨 ${TRADING_PHASE} 시점 데이터 수집 실패 - 즉시 확인 필요"
          else
            echo "::warning::⚠️ ${TRADING_PHASE} 데이터 수집 실패"
          fi
          
          exit 1
        fi

    - name: 실패 시 로그 업로드 (최신 버전)
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: krx-failure-logs-${{ github.run_number }}
        path: |
          *.log
          /tmp/*.log
          /var/log/*.log
        retention-days: 7
        if-no-files-found: ignore

  # Job 3: 텔레그램 알림 (조건부 실행)
  telegram-notification:
    needs: [check-trading-conditions, collect-krx-data]
    runs-on: ubuntu-latest
    if: |
      always() && (
        needs.check-trading-conditions.outputs.is_daily_summary == 'true' || 
        github.event.inputs.send_telegram == 'true' ||
        (needs.collect-krx-data.result == 'failure' && needs.check-trading-conditions.outputs.execution_priority == 'critical') ||
        needs.collect-krx-data.result == 'failure'
      )
    
    # 타임아웃 설정
    timeout-minutes: 5
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: Python 환경 설정 (알림용)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: 알림 패키지 설치 (최소화)
      run: |
        echo "📱 텔레그램 알림 시스템 준비"
        python -m pip install --upgrade pip
        # 텔레그램에 필요한 최소 패키지만
        pip install requests gspread google-auth pandas beautifulsoup4
        echo "✅ 알림 시스템 준비 완료"
        
    - name: 거래시간 맞춤 텔레그램 알림
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.CARBON_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.ESG_TESTER }}
        COLLECTION_STATUS: ${{ needs.collect-krx-data.outputs.collection_status || 'failed' }}
        COLLECTION_MESSAGE: ${{ needs.collect-krx-data.outputs.collection_message || 'No message' }}
        MARKET_PHASE: ${{ needs.check-trading-conditions.outputs.market_phase }}
        TRADING_PHASE: ${{ needs.check-trading-conditions.outputs.trading_phase }}
        EXECUTION_PRIORITY: ${{ needs.check-trading-conditions.outputs.execution_priority }}
        CURRENT_KST: ${{ needs.check-trading-conditions.outputs.current_kst }}
        FORCE_TELEGRAM: ${{ github.event.inputs.send_telegram || 'false' }}
        IS_DAILY_SUMMARY: ${{ needs.check-trading-conditions.outputs.is_daily_summary }}
      run: |
        echo "=== 텔레그램 알림 시작 ==="
        echo "📊 시장: ${MARKET_PHASE}"
        echo "⚡ 거래: ${TRADING_PHASE}"
        echo "🎯 우선도: ${EXECUTION_PRIORITY}"
        echo "📱 상태: ${COLLECTION_STATUS}"
        echo "🕐 시간: ${CURRENT_KST}"
        
        # 텔레그램 인증 확인
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "⚠️ 텔레그램 설정 없음 - 알림 건너뜀"
          echo "💡 GitHub Secrets에서 CARBON_TOKEN, ESG_TESTER 확인"
          exit 0
        fi
        
        # 거래 컨텍스트 정보 전달
        export TRADING_CONTEXT="${TRADING_PHASE}|${EXECUTION_PRIORITY}|${CURRENT_KST}"
        
        echo "📤 텔레그램 알림 전송 중..."
        
        if python telegram_notifier.py; then
          echo "✅ 텔레그램 알림 전송 성공"
          echo "::notice::📱 텔레그램 알림 전송 완료"
        else
          echo "❌ 텔레그램 알림 전송 실패"
          echo "::warning::📱 텔레그램 알림 전송 실패 - 봇 설정 확인 필요"
        fi

    - name: 워크플로우 실행 요약 생성
      if: always()
      run: |
        echo "## 📊 KRX 배출권 거래시간 데이터 수집 결과" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🕐 실행 시간**: ${{ needs.check-trading-conditions.outputs.current_kst }} KST" >> $GITHUB_STEP_SUMMARY
        echo "**📈 시장 상태**: ${{ needs.check-trading-conditions.outputs.market_phase }}" >> $GITHUB_STEP_SUMMARY
        echo "**⚡ 거래 단계**: ${{ needs.check-trading-conditions.outputs.trading_phase }}" >> $GITHUB_STEP_SUMMARY
        echo "**🎯 실행 우선도**: ${{ needs.check-trading-conditions.outputs.execution_priority }}" >> $GITHUB_STEP_SUMMARY
        echo "**📊 수집 결과**: ${{ needs.collect-krx-data.outputs.collection_status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "**🏆 데이터 품질**: ${{ needs.collect-krx-data.outputs.data_quality || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # 거래시간 안내
        echo "### 📈 한국 배출권 거래시간" >> $GITHUB_STEP_SUMMARY
        echo "- **09:00-10:00**: 주문접수 (단일가 매매)" >> $GITHUB_STEP_SUMMARY
        echo "- **10:00-11:30**: 실시간 복수가격 매매" >> $GITHUB_STEP_SUMMARY  
        echo "- **11:30-12:00**: 단일가 매매 (종가 결정)" >> $GITHUB_STEP_SUMMARY
        echo "- **15:00**: 일일 요약 및 텔레그램 알림" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # 다음 중요 시점
        CURRENT_HOUR=$(date +%H)
        echo "### ⏰ 다음 중요 시점" >> $GITHUB_STEP_SUMMARY
        case "${CURRENT_HOUR}" in
          09)
            echo "- **10:00**: 시가 체결 (Critical)" >> $GITHUB_STEP_SUMMARY
            ;;
          10|11)
            echo "- **12:00**: 종가 체결 (Critical)" >> $GITHUB_STEP_SUMMARY
            ;;
          12|13|14)
            echo "- **15:00**: 일일 요약 (텔레그램 알림)" >> $GITHUB_STEP_SUMMARY
            ;;
          *)
            echo "- **내일 09:00**: 다음 거래일 시작" >> $GITHUB_STEP_SUMMARY
            ;;
        esac
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # 실행 결과별 알림
        COLLECTION_STATUS="${{ needs.collect-krx-data.outputs.collection_status }}"
        SHOULD_RUN="${{ needs.check-trading-conditions.outputs.should_run }}"
        EXECUTION_PRIORITY="${{ needs.check-trading-conditions.outputs.execution_priority }}"
        
        if [ "${COLLECTION_STATUS}" = "success" ]; then
          if [ "${EXECUTION_PRIORITY}" = "critical" ]; then
            echo "::notice::🔥 중요 시점 데이터 수집 성공!"
          else
            echo "::notice::✅ 거래시간 데이터 수집 성공"
          fi
        elif [ "${SHOULD_RUN}" = "false" ]; then
          echo "::notice::⏸️ 거래시간 외 - 실행 건너뜀"
        elif [ "${EXECUTION_PRIORITY}" = "critical" ]; then
          echo "::error::🚨 중요 거래 시점 데이터 수집 실패 - 즉시 확인 필요!"
        else
          echo "::warning::⚠️ 데이터 수집 실패 - 확인 필요"
        fi
        
        # 추가 정보
        echo "### 🔧 문제 해결" >> $GITHUB_STEP_SUMMARY
        echo "- **환경변수 확인**: Settings → Secrets and variables → Actions" >> $GITHUB_STEP_SUMMARY
        echo "- **텔레그램 설정**: CARBON_TOKEN (봇), ESG_TESTER (채팅ID)" >> $GITHUB_STEP_SUMMARY
        echo "- **수동 실행**: Actions → Run workflow" >> $GITHUB_STEP_SUMMARY
        echo "- **로그 확인**: 실패 시 Artifacts에서 로그 다운로드" >> $GITHUB_STEP_SUMMARY
