# .github/workflows/KAU_price_collector.yml
name: KRX ETS Data Collector with Telegram Alerts

on:
  schedule:
    - cron: '0 1-3 * * 1-5'   # Every hour during trading hours (10:00-12:00 KST)
    - cron: '30 3 * * 1-5'    # 12:30 KST - After market close
    - cron: '0 6 * * 1-5'     # 15:00 KST - Daily summary and telegram alert
    
  workflow_dispatch:
    inputs:
      force_collection:
        description: 'Force collection (ignore trading hours)'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean
      test_mode:
        description: 'Test mode (no actual updates)'
        required: false
        default: false
        type: boolean
      send_telegram:
        description: 'Force send telegram summary'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    outputs:
      collection_status: ${{ steps.collection.outputs.status }}
      collection_message: ${{ steps.collection.outputs.message }}
      is_daily_summary: ${{ steps.market_check.outputs.is_daily_summary }}
      
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python with caching
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ Data collection dependencies installed"
        
    - name: Check market status and execution time
      id: market_check
      run: |
        CURRENT_HOUR=$(TZ=Asia/Seoul date +%H)
        CURRENT_MINUTE=$(TZ=Asia/Seoul date +%M)
        CURRENT_TIME="${CURRENT_HOUR}:${CURRENT_MINUTE}"
        CURRENT_DAY=$(TZ=Asia/Seoul date +%u)
        CURRENT_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
        
        echo "current_time=${CURRENT_TIME}" >> $GITHUB_OUTPUT
        echo "current_hour=${CURRENT_HOUR}" >> $GITHUB_OUTPUT
        echo "current_date=${CURRENT_DATE}" >> $GITHUB_OUTPUT
        
        IS_WEEKDAY="false"
        if [ "${CURRENT_DAY}" -le 5 ]; then
          IS_WEEKDAY="true"
        fi
        echo "is_weekday=${IS_WEEKDAY}" >> $GITHUB_OUTPUT
        
        # 15:00 KST (06:00 UTC) 실행인지 확인 (일일 요약 시간)
        IS_DAILY_SUMMARY="false"
        if [ "${CURRENT_HOUR}" -eq 15 ]; then
          IS_DAILY_SUMMARY="true"
        fi
        echo "is_daily_summary=${IS_DAILY_SUMMARY}" >> $GITHUB_OUTPUT
        
        IS_TRADING_HOURS="false"
        MARKET_PHASE="closed"
        
        if [ "${IS_WEEKDAY}" = "true" ]; then
          if [ "${CURRENT_HOUR}" -ge 10 ] && [ "${CURRENT_HOUR}" -lt 12 ]; then
            IS_TRADING_HOURS="true"
            MARKET_PHASE="trading"
          elif [ "${CURRENT_HOUR}" -eq 12 ] && [ "${CURRENT_MINUTE}" -ge 30 ]; then
            MARKET_PHASE="just_closed"
          elif [ "${CURRENT_HOUR}" -eq 15 ]; then
            MARKET_PHASE="daily_summary"
          elif [ "${CURRENT_HOUR}" -eq 9 ]; then
            MARKET_PHASE="pre_trading"
          else
            MARKET_PHASE="post_trading"
          fi
        fi
        
        echo "is_trading_hours=${IS_TRADING_HOURS}" >> $GITHUB_OUTPUT
        echo "market_phase=${MARKET_PHASE}" >> $GITHUB_OUTPUT
        
        echo "Current time: ${CURRENT_TIME} KST"
        echo "Date: ${CURRENT_DATE}"
        echo "Market phase: ${MARKET_PHASE}"
        echo "Daily summary time: ${IS_DAILY_SUMMARY}"

    - name: Verify environment variables
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.CARBON_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.ESG_TESTER }}
      run: |
        echo "=== Environment Variables Check ==="
        
        if [ -z "$GOOGLE_SHEETS_CREDS" ]; then
          echo "❌ ERROR: GOOGLE_SHEETS_CREDS not found"
          exit 1
        else
          echo "✅ GOOGLE_SHEETS_CREDS: Found (${#GOOGLE_SHEETS_CREDS} characters)"
        fi
        
        if [ -z "$KAU_SHEET_ID" ]; then
          echo "❌ ERROR: KAU_SHEET_ID not found"
          exit 1
        else
          echo "✅ KAU_SHEET_ID: Found ($KAU_SHEET_ID)"
        fi
        
        if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
          echo "❌ WARNING: TELEGRAM_BOT_TOKEN not found"
          echo "   → Check GitHub Secret: 'CARBON_TOKEN'"
        else
          echo "✅ TELEGRAM_BOT_TOKEN: Found (${#TELEGRAM_BOT_TOKEN} characters)"
          # 앞 15글자만 출력 (보안상 안전)
          TOKEN_PREFIX="${TELEGRAM_BOT_TOKEN:0:15}..."
          echo "   → Starts with: $TOKEN_PREFIX"
          # 토큰 형식 검증 (bot으로 시작하는지)
          if [[ "$TELEGRAM_BOT_TOKEN" == bot* ]]; then
            echo "   → Token format looks correct (starts with 'bot')"
          else
            echo "   → ⚠️  Token format may be incorrect (should start with 'bot')"
          fi
        fi
        
        if [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "❌ WARNING: TELEGRAM_CHAT_ID not found"
          echo "   → Check GitHub Secret: 'ESG_TESTER'"
        else
          echo "✅ TELEGRAM_CHAT_ID: Found ($TELEGRAM_CHAT_ID)"
          # 채팅 ID 형식 검증 (숫자 또는 -로 시작)
          if [[ "$TELEGRAM_CHAT_ID" =~ ^-?[0-9]+$ ]]; then
            echo "   → Chat ID format looks correct"
          else
            echo "   → ⚠️  Chat ID format may be incorrect (should be numeric)"
          fi
        fi
        
        echo "=== Telegram Credentials Status ==="
        if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
          echo "✅ All telegram credentials available"
        else
          echo "❌ Missing telegram credentials - notifications will be skipped"
        fi

    - name: Execute data collection
      id: collection
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        MARKET_PHASE: ${{ steps.market_check.outputs.market_phase }}
        DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
        IS_DAILY_SUMMARY: ${{ steps.market_check.outputs.is_daily_summary }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.CARBON_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.ESG_TESTER }}
      run: |
        echo "Market phase: ${{ steps.market_check.outputs.market_phase }}"
        echo "Current time: ${{ steps.market_check.outputs.current_time }} KST"
        echo "Trading hours: ${{ steps.market_check.outputs.is_trading_hours }}"
        echo "Daily summary: ${{ steps.market_check.outputs.is_daily_summary }}"
        echo "Debug mode: ${{ github.event.inputs.debug_mode }}"
        echo "Test mode: ${{ github.event.inputs.test_mode }}"
        
        # Skip on weekends
        if [ "${{ steps.market_check.outputs.is_weekday }}" = "false" ]; then
          echo "status=skipped" >> $GITHUB_OUTPUT
          echo "message=Weekend - No execution" >> $GITHUB_OUTPUT
          echo "Skipping: Weekend"
          exit 0
        fi
        
        # Check trading hours unless forced
        if [ "${{ github.event.inputs.force_collection }}" != "true" ]; then
          case "${{ steps.market_check.outputs.market_phase }}" in
            "closed")
              echo "status=skipped" >> $GITHUB_OUTPUT
              echo "message=Market closed - No execution" >> $GITHUB_OUTPUT
              echo "Skipping: Market closed"
              exit 0
              ;;
            "trading"|"just_closed"|"post_trading"|"daily_summary")
              echo "Proceeding: Active collection period"
              ;;
            *)
              echo "Proceeding: Limited collection"
              ;;
          esac
        else
          echo "Force collection mode enabled"
        fi
        
        # Execute the Python script and capture result
        echo "Starting KRX data collection..."
        if python KAU_price_collector.py; then
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message=Data collection completed successfully" >> $GITHUB_OUTPUT
        else
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "message=Data collection failed with errors" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Run analysis script
      if: always()
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: |
        if [ "$TEST_MODE" = "true" ]; then
          echo "Test mode: Skipping analysis"
          exit 0
        fi
        
        echo "Running analysis script..."
        if [ -f "analyze_results.py" ]; then
          python analyze_results.py
        else
          echo "Analysis script not found, skipping detailed analysis"
        fi

  telegram-notification:
    needs: collect-data
    runs-on: ubuntu-latest
    if: always() && (needs.collect-data.outputs.is_daily_summary == 'true' || github.event.inputs.send_telegram == 'true')
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python with cached dependencies
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        cache: 'pip'
        
    - name: Install minimal dependencies (using cache)
      run: |
        python -m pip install --upgrade pip
        # 텔레그램 알림에 필요한 최소 패키지만 설치 (캐시에서 빠르게 복원)
        pip install requests==2.31.0 gspread==5.12.0 google-auth==2.23.4 pandas==2.1.3
        echo "✅ Telegram dependencies installed from cache"
        
    - name: Generate daily summary and send telegram alert
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.CARBON_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.ESG_TESTER }}
        COLLECTION_STATUS: ${{ needs.collect-data.outputs.collection_status }}
        COLLECTION_MESSAGE: ${{ needs.collect-data.outputs.collection_message }}
        FORCE_TELEGRAM: ${{ github.event.inputs.send_telegram || 'false' }}
      run: |
        echo "=== Daily Summary and Telegram Notification ==="
        echo "Collection Status: ${COLLECTION_STATUS}"
        echo "Collection Message: ${COLLECTION_MESSAGE}"
        
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "❌ Telegram credentials not available - skipping notification"
          exit 0
        fi
        
        # Execute telegram notification script
        python telegram_notifier.py

    - name: Generate workflow summary
      if: always()
      run: |
        echo "## 📊 KRX ETS Data Collection Summary" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Date**: $(TZ=Asia/Seoul date +%Y-%m-%d)" >> $GITHUB_STEP_SUMMARY
        echo "**Time**: $(TZ=Asia/Seoul date +%H:%M:%S) KST" >> $GITHUB_STEP_SUMMARY
        echo "**Collection Status**: ${{ needs.collect-data.outputs.collection_status }}" >> $GITHUB_STEP_SUMMARY
        echo "**Message**: ${{ needs.collect-data.outputs.collection_message }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.collect-data.outputs.is_daily_summary }}" = "true" ]; then
          echo "**📱 Telegram Alert**: Daily summary sent" >> $GITHUB_STEP_SUMMARY
        else
          echo "**📱 Telegram Alert**: Not applicable (not daily summary time)" >> $GITHUB_STEP_SUMMARY
        fi
        
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "### Trading Schedule" >> $GITHUB_STEP_SUMMARY
        echo "- **Trading Hours**: 10:00-12:00 KST (Hourly collection)" >> $GITHUB_STEP_SUMMARY
        echo "- **Post-Market**: 12:30 KST" >> $GITHUB_STEP_SUMMARY
        echo "- **Daily Summary**: 15:00 KST (With Telegram alerts)" >> $GITHUB_STEP_SUMMARY
        
        if [ "${{ needs.collect-data.outputs.collection_status }}" = "success" ]; then
          echo "::notice::✅ KRX data collection completed successfully"
        else
          echo "::error::❌ KRX data collection failed - Check logs and Telegram alerts"
        fi
