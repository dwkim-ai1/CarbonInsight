# .github/workflows/KAU_price_collector.yml
# 최적화된 KRX 데이터 수집 시스템 (중복 제거 + 맞춤형 스케줄)

name: KRX ETS Data Collector (최적화 버전)

on:
  schedule:
    # === 최적화된 거래시간 스케줄 ===
    
    # 📊 09:00-10:00 KST (30분 간격) - 주문접수 및 준비
    - cron: '0 0 * * 1-5'     # KST 09:00 (UTC 00:00)
    - cron: '30 0 * * 1-5'    # KST 09:30 (UTC 00:30)
    - cron: '0 1 * * 1-5'     # KST 10:00 (UTC 01:00)
    
    # ⚡ 10:00-11:30 KST (10분 간격) - 실시간 거래 집중 모니터링
    - cron: '10 1 * * 1-5'    # KST 10:10 (UTC 01:10)
    - cron: '20 1 * * 1-5'    # KST 10:20 (UTC 01:20)
    - cron: '30 1 * * 1-5'    # KST 10:30 (UTC 01:30)
    - cron: '40 1 * * 1-5'    # KST 10:40 (UTC 01:40)
    - cron: '50 1 * * 1-5'    # KST 10:50 (UTC 01:50)
    - cron: '0 2 * * 1-5'     # KST 11:00 (UTC 02:00)
    - cron: '10 2 * * 1-5'    # KST 11:10 (UTC 02:10)
    - cron: '20 2 * * 1-5'    # KST 11:20 (UTC 02:20)
    - cron: '30 2 * * 1-5'    # KST 11:30 (UTC 02:30)
    
    # 🏁 11:30-12:30 KST (30분 간격) - 종가 체결 준비 및 마감
    - cron: '0 3 * * 1-5'     # KST 12:00 (UTC 03:00) ⭐ 종가 체결
    - cron: '30 3 * * 1-5'    # KST 12:30 (UTC 03:30) ⭐⭐ 최종 마감 + 텔레그램
    
  workflow_dispatch:
    inputs:
      force_collection:
        description: '강제 수집 (거래시간 무시)'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: '디버그 모드 (상세 로그)'
        required: false
        default: false
        type: boolean
      test_mode:
        description: '테스트 모드 (실제 업데이트 없음)'
        required: false
        default: false
        type: boolean
      send_telegram:
        description: '텔레그램 요약 강제 전송'
        required: false
        default: false
        type: boolean
      skip_optimization:
        description: '중복 최적화 건너뛰기'
        required: false
        default: false
        type: boolean

# 필요한 최소 권한만 부여
permissions:
  contents: read
  actions: write

env:
  TZ: Asia/Seoul
  PYTHON_VERSION: '3.9'

jobs:
  # Job 1: 거래 조건 확인 (최적화 스케줄 반영)
  check-trading-conditions:
    runs-on: ubuntu-22.04
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
      current_time: ${{ steps.check.outputs.current_time }}
      current_kst: ${{ steps.check.outputs.current_kst }}
      market_phase: ${{ steps.check.outputs.market_phase }}
      trading_phase: ${{ steps.check.outputs.trading_phase }}
      is_final_session: ${{ steps.check.outputs.is_final_session }}
      collection_frequency: ${{ steps.check.outputs.collection_frequency }}
      execution_priority: ${{ steps.check.outputs.execution_priority }}
      
    steps:
    - name: 최적화된 거래시간 및 실행 조건 분석
      id: check
      run: |
        echo "=== 최적화된 한국 배출권 거래시간 분석 ($(date '+%Y-%m-%d %H:%M:%S') KST) ==="
        
        CURRENT_HOUR=$(date +%H)
        CURRENT_MINUTE=$(date +%M)
        CURRENT_TIME="${CURRENT_HOUR}:${CURRENT_MINUTE}"
        CURRENT_DAY=$(date +%u)
        CURRENT_KST=$(date '+%Y-%m-%d %H:%M:%S')
        
        echo "📅 현재: ${CURRENT_KST} KST"
        echo "📊 요일: ${CURRENT_DAY} (1=월, 5=금)"
        echo "⏰ 시각: ${CURRENT_TIME}"
        
        echo "current_time=${CURRENT_TIME}" >> $GITHUB_OUTPUT
        echo "current_kst=${CURRENT_KST}" >> $GITHUB_OUTPUT
        
        # 거래일 확인
        IS_TRADING_DAY="false"
        if [ "${CURRENT_DAY}" -le 5 ]; then
          IS_TRADING_DAY="true"
        fi
        
        # 최적화된 실행 조건 분석
        SHOULD_RUN="false"
        MARKET_PHASE="market_closed"
        TRADING_PHASE="none"
        EXECUTION_PRIORITY="low"
        IS_FINAL_SESSION="false"
        COLLECTION_FREQUENCY="standard"
        
        if [ "${IS_TRADING_DAY}" = "true" ]; then
          case "${CURRENT_HOUR}" in
            09)
              SHOULD_RUN="true"
              MARKET_PHASE="pre_trading"
              TRADING_PHASE="order_acceptance"
              EXECUTION_PRIORITY="medium"
              COLLECTION_FREQUENCY="30min"
              echo "📝 주문접수 시간 (30분 간격 수집)"
              ;;
            10)
              SHOULD_RUN="true"
              MARKET_PHASE="active_trading"
              COLLECTION_FREQUENCY="10min"
              if [ "${CURRENT_MINUTE}" -eq 0 ]; then
                TRADING_PHASE="opening_price_decision"
                EXECUTION_PRIORITY="critical"
                echo "🔥 시가 체결 시점 (10분 간격 시작)"
              else
                TRADING_PHASE="real_time_trading_intensive"
                EXECUTION_PRIORITY="high"
                echo "⚡ 실시간 거래 집중 모니터링 (10분 간격)"
              fi
              ;;
            11)
              SHOULD_RUN="true"
              MARKET_PHASE="active_trading"
              COLLECTION_FREQUENCY="10min"
              if [ "${CURRENT_MINUTE}" -lt 30 ]; then
                TRADING_PHASE="real_time_trading_intensive"
                EXECUTION_PRIORITY="high"
                echo "⚡ 실시간 거래 집중 계속 (10분 간격)"
              else
                TRADING_PHASE="closing_preparation"
                EXECUTION_PRIORITY="high"
                COLLECTION_FREQUENCY="30min"
                echo "📊 종가 준비 시작 (30분 간격으로 변경)"
              fi
              ;;
            12)
              SHOULD_RUN="true"
              MARKET_PHASE="market_close"
              COLLECTION_FREQUENCY="30min"
              if [ "${CURRENT_MINUTE}" -eq 0 ]; then
                TRADING_PHASE="closing_price_decision"
                EXECUTION_PRIORITY="critical"
                echo "🏁 종가 체결 시점"
              elif [ "${CURRENT_MINUTE}" -eq 30 ]; then
                TRADING_PHASE="final_settlement"
                EXECUTION_PRIORITY="critical"
                IS_FINAL_SESSION="true"
                echo "🎯 최종 마감 + 텔레그램 발송"
              else
                MARKET_PHASE="post_trading"
                TRADING_PHASE="market_closed"
                echo "📋 거래 종료"
              fi
              ;;
            *)
              echo "⏸️ 거래시간 외"
              ;;
          esac
        else
          echo "⏸️ 주말/공휴일"
        fi
        
        # 수동 실행 처리
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          SHOULD_RUN="true"
          MARKET_PHASE="manual_execution"
          TRADING_PHASE="manual"
          EXECUTION_PRIORITY="high"
          COLLECTION_FREQUENCY="manual"
          echo "🔧 수동 실행 - 최적화 시스템 테스트"
        fi
        
        echo "should_run=${SHOULD_RUN}" >> $GITHUB_OUTPUT
        echo "market_phase=${MARKET_PHASE}" >> $GITHUB_OUTPUT
        echo "trading_phase=${TRADING_PHASE}" >> $GITHUB_OUTPUT
        echo "is_final_session=${IS_FINAL_SESSION}" >> $GITHUB_OUTPUT
        echo "collection_frequency=${COLLECTION_FREQUENCY}" >> $GITHUB_OUTPUT
        echo "execution_priority=${EXECUTION_PRIORITY}" >> $GITHUB_OUTPUT
        
        echo ""
        echo "=== 최적화된 실행 결정 ==="
        echo "✅ 실행: ${SHOULD_RUN}"
        echo "📈 시장: ${MARKET_PHASE}"
        echo "⚡ 거래: ${TRADING_PHASE}"
        echo "🎯 우선도: ${EXECUTION_PRIORITY}"
        echo "📊 수집주기: ${COLLECTION_FREQUENCY}"
        echo "📱 텔레그램: ${IS_FINAL_SESSION}"

  # Job 2: 최적화된 데이터 수집
  collect-krx-data:
    needs: check-trading-conditions
    runs-on: ubuntu-22.04
    if: needs.check-trading-conditions.outputs.should_run == 'true'
    
    timeout-minutes: 15
    
    outputs:
      collection_status: ${{ steps.collection.outputs.status }}
      collection_message: ${{ steps.collection.outputs.message }}
      extraction_methods: ${{ steps.collection.outputs.extraction_methods }}
      optimization_stats: ${{ steps.collection.outputs.optimization_stats }}
      
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: Python 환경 설정 (최적화)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        cache-dependency-path: 'requirements.txt'
        
    - name: 시스템 의존성 설치 (최소화)
      run: |
        echo "🔧 시스템 의존성 설치 중 (최적화 버전)..."
        
        sudo apt-get update
        
        # Playwright 핵심 패키지만
        sudo apt-get install -y --no-install-recommends \
          libnss3 libnspr4 libatk-bridge2.0-0 libdrm2 libxkbcommon0 \
          libxcomposite1 libxdamage1 libxrandr2 libgbm1 libxss1 libgtk-3-0 \
          || echo "⚠️ 일부 패키지 설치 실패 - 계속 진행"
        
        # 오디오 패키지 (선택적)
        sudo apt-get install -y libasound2 2>/dev/null || \
        echo "⚠️ 오디오 패키지 설치 실패 - 무시"
        
        echo "✅ 시스템 의존성 설치 완료"
        
    - name: Python 패키지 설치
      run: |
        echo "⚡ Python 패키지 설치 (캐시 적용)"
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        echo "✅ Python 패키지 설치 완료"
        
    - name: Playwright 브라우저 설치
      run: |
        echo "🌐 Playwright 브라우저 설치..."
        
        if python -m playwright install chromium; then
          echo "✅ Chromium 브라우저 설치 성공"
          BROWSER_INSTALLED=true
        else
          echo "⚠️ Chromium 브라우저 설치 실패 - 대체 방법 사용"
          BROWSER_INSTALLED=false
        fi
        
        echo "PLAYWRIGHT_AVAILABLE=${BROWSER_INSTALLED}" >> $GITHUB_ENV
        
    - name: 환경변수 검증
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
      run: |
        echo "=== 환경변수 검증 (최적화 버전) ==="
        
        ERROR_COUNT=0
        
        if [ -z "$GOOGLE_SHEETS_CREDS" ]; then
          echo "❌ CRITICAL: GOOGLE_SHEETS_CREDS 누락"
          ERROR_COUNT=$((ERROR_COUNT + 1))
        else
          echo "✅ GOOGLE_SHEETS_CREDS: OK (${#GOOGLE_SHEETS_CREDS} chars)"
        fi
        
        if [ -z "$KAU_SHEET_ID" ]; then
          echo "❌ CRITICAL: KAU_SHEET_ID 누락"
          ERROR_COUNT=$((ERROR_COUNT + 1))
        else
          echo "✅ KAU_SHEET_ID: OK ($KAU_SHEET_ID)"
        fi
        
        if [ $ERROR_COUNT -gt 0 ]; then
          echo "❌ 필수 환경변수 ${ERROR_COUNT}개 누락!"
          exit 1
        fi
        
        echo "✅ 환경변수 검증 완료"

    - name: 최적화된 KRX 데이터 수집 (중복 제거)
      id: collection
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        MARKET_PHASE: ${{ needs.check-trading-conditions.outputs.market_phase }}
        TRADING_PHASE: ${{ needs.check-trading-conditions.outputs.trading_phase }}
        EXECUTION_PRIORITY: ${{ needs.check-trading-conditions.outputs.execution_priority }}
        COLLECTION_FREQUENCY: ${{ needs.check-trading-conditions.outputs.collection_frequency }}
        CURRENT_KST: ${{ needs.check-trading-conditions.outputs.current_kst }}
        DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
        TEST_MODE: ${{ github.event.inputs.test_mode || 'false' }}
        SKIP_OPTIMIZATION: ${{ github.event.inputs.skip_optimization || 'false' }}
        PLAYWRIGHT_BROWSER_AVAILABLE: ${{ env.PLAYWRIGHT_AVAILABLE || 'false' }}
      run: |
        echo "=== 최적화된 KRX 데이터 수집 시작 ==="
        echo "🌐 수집 방법: Playwright (최적화)"
        echo "📊 시장: ${MARKET_PHASE}"
        echo "⚡ 거래: ${TRADING_PHASE}"
        echo "🎯 우선도: ${EXECUTION_PRIORITY}"
        echo "📊 수집주기: ${COLLECTION_FREQUENCY}"
        echo "⏰ 시간: ${CURRENT_KST} KST"
        echo "🔧 최적화: $([[ "${SKIP_OPTIMIZATION}" == "true" ]] && echo "비활성화" || echo "활성화")"
        
        # 수집 주기별 설정
        case "${COLLECTION_FREQUENCY}" in
          "10min")
            echo "⚡ 10분 간격 - 고속 수집 모드"
            export COLLECTION_MODE="fast"
            export MAX_RETRIES=2
            export ENABLE_OPTIMIZATION=true
            ;;
          "30min")
            echo "📊 30분 간격 - 표준 수집 모드"
            export COLLECTION_MODE="standard"
            export MAX_RETRIES=3
            export ENABLE_OPTIMIZATION=true
            ;;
          "manual")
            echo "🔧 수동 실행 - 전체 기능 모드"
            export COLLECTION_MODE="full"
            export MAX_RETRIES=5
            export ENABLE_OPTIMIZATION=$([[ "${SKIP_OPTIMIZATION}" == "true" ]] && echo "false" || echo "true")
            ;;
          *)
            echo "📋 기본 모드"
            export COLLECTION_MODE="standard"
            export MAX_RETRIES=3
            export ENABLE_OPTIMIZATION=true
            ;;
        esac
        
        # 중요 시점 설정
        if [ "${EXECUTION_PRIORITY}" = "critical" ]; then
          export ENABLE_ALL_METHODS=true
          export ENABLE_OCR_BACKUP=true
          echo "🔥 중요 시점 - 모든 수집 방법 활성화"
        fi
        
        echo "🚀 최적화된 데이터 수집 스크립트 실행..."
        
        START_TIME=$(date +%s)
        
        if python KAU_price_collector.py; then
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "status=success" >> $GITHUB_OUTPUT
          echo "message=최적화 수집 성공 (${DURATION}초)" >> $GITHUB_OUTPUT
          echo "extraction_methods=playwright_optimized" >> $GITHUB_OUTPUT
          
          # 최적화 통계 (환경변수로 전달받음)
          OPTIMIZATION_STATS=$(echo $OPTIMIZATION_STATS_JSON 2>/dev/null || echo '{"added":0,"skipped":0,"efficiency":0}')
          echo "optimization_stats=${OPTIMIZATION_STATS}" >> $GITHUB_OUTPUT
          
          echo "✅ 최적화된 데이터 수집 성공!"
          echo "⏱️ 실행 시간: ${DURATION}초"
          echo "💾 수집 주기: ${COLLECTION_FREQUENCY}"
          
          # 수집 주기별 성공 메시지
          case "${COLLECTION_FREQUENCY}" in
            "10min")
              echo "⚡ 10분 간격 고속 수집 완료!"
              echo "::notice::⚡ 실시간 집중 모니터링 - 데이터 수집 성공"
              ;;
            "30min")
              echo "📊 30분 간격 표준 수집 완료!"
              echo "::notice::📊 표준 수집 - 데이터 업데이트 성공"
              ;;
            "manual")
              echo "🔧 수동 실행 완료!"
              echo "::notice::🔧 수동 실행 - 최적화 테스트 성공"
              ;;
          esac
          
        else
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - START_TIME))
          
          echo "status=failed" >> $GITHUB_OUTPUT
          echo "message=최적화 수집 실패 (${DURATION}초)" >> $GITHUB_OUTPUT
          echo "extraction_methods=failed" >> $GITHUB_OUTPUT
          echo "optimization_stats={\"error\":true}" >> $GITHUB_OUTPUT
          
          echo "❌ 최적화된 데이터 수집 실패!"
          echo "⏱️ 실행 시간: ${DURATION}초"
          
          if [ "${EXECUTION_PRIORITY}" = "critical" ]; then
            echo "🚨 CRITICAL: 중요 시점 수집 실패!"
            echo "::error::🚨 ${TRADING_PHASE} - 최적화 시스템 실패"
          else
            echo "::warning::⚠️ ${TRADING_PHASE} 최적화 수집 실패"
          fi
          
          exit 1
        fi

  # Job 3: 텔레그램 알림 (12:30 KST 또는 조건부)
  telegram-notification:
    needs: [check-trading-conditions, collect-krx-data]
    runs-on: ubuntu-22.04
    if: |
      always() && (
        needs.check-trading-conditions.outputs.is_final_session == 'true' || 
        github.event.inputs.send_telegram == 'true' ||
        (needs.collect-krx-data.result == 'failure' && needs.check-trading-conditions.outputs.execution_priority == 'critical') ||
        needs.collect-krx-data.result == 'failure'
      )
    
    timeout-minutes: 5
    
    steps:
    - name: 저장소 체크아웃
      uses: actions/checkout@v4
      
    - name: Python 환경 설정 (알림용)
      uses: actions/setup-python@v5
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
        
    - name: 알림 패키지 설치
      run: |
        echo "📱 텔레그램 알림 시스템 준비 (최적화 버전)"
        python -m pip install --upgrade pip
        pip install requests gspread google-auth pandas beautifulsoup4
        echo "✅ 알림 시스템 준비 완료"
        
    - name: 최적화된 텔레그램 알림
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        TELEGRAM_BOT_TOKEN: ${{ secrets.CARBON_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.ESG_TESTER }}
        COLLECTION_STATUS: ${{ needs.collect-krx-data.outputs.collection_status || 'failed' }}
        COLLECTION_MESSAGE: ${{ needs.collect-krx-data.outputs.collection_message || 'No message' }}
        EXTRACTION_METHODS: ${{ needs.collect-krx-data.outputs.extraction_methods || 'none' }}
        OPTIMIZATION_STATS: ${{ needs.collect-krx-data.outputs.optimization_stats || '{}' }}
        MARKET_PHASE: ${{ needs.check-trading-conditions.outputs.market_phase }}
        TRADING_PHASE: ${{ needs.check-trading-conditions.outputs.trading_phase }}
        EXECUTION_PRIORITY: ${{ needs.check-trading-conditions.outputs.execution_priority }}
        COLLECTION_FREQUENCY: ${{ needs.check-trading-conditions.outputs.collection_frequency }}
        CURRENT_KST: ${{ needs.check-trading-conditions.outputs.current_kst }}
        FORCE_TELEGRAM: ${{ github.event.inputs.send_telegram || 'false' }}
        IS_FINAL_SESSION: ${{ needs.check-trading-conditions.outputs.is_final_session }}
      run: |
        echo "=== 최적화된 텔레그램 알림 시작 ==="
        echo "🌐 수집 방법: ${EXTRACTION_METHODS}"
        echo "📊 시장: ${MARKET_PHASE}"
        echo "⚡ 거래: ${TRADING_PHASE}"
        echo "🎯 우선도: ${EXECUTION_PRIORITY}"
        echo "📊 수집주기: ${COLLECTION_FREQUENCY}"
        echo "📱 상태: ${COLLECTION_STATUS}"
        echo "🕐 시간: ${CURRENT_KST}"
        echo "🎯 최종세션: ${IS_FINAL_SESSION}"
        
        # 텔레그램 인증 확인
        if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
          echo "⚠️ 텔레그램 설정 없음 - 알림 건너뜀"
          exit 0
        fi
        
        # 최적화 통계 전달
        export OPTIMIZATION_CONTEXT="optimized|${COLLECTION_FREQUENCY}|${OPTIMIZATION_STATS}|${CURRENT_KST}"
        
        echo "📤 최적화 결과 텔레그램 알림 전송 중..."
        
        if python telegram_notifier.py; then
          echo "✅ 텔레그램 알림 전송 성공"
          
          if [ "${IS_FINAL_SESSION}" = "true" ]; then
            echo "::notice::📱 12:30 KST 최종 일일 요약 전송 완료"
          else
            echo "::notice::📱 긴급 알림 전송 완료"
          fi
        else
          echo "❌ 텔레그램 알림 전송 실패"
          echo "::warning::📱 텔레그램 알림 실패"
        fi

    - name: 최적화 워크플로우 실행 요약
      if: always()
      run: |
        echo "## 🚀 최적화된 KRX 배출권 데이터 수집 결과" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**🕐 실행 시간**: ${{ needs.check-trading-conditions.outputs.current_kst }} KST" >> $GITHUB_STEP_SUMMARY
        echo "**📈 시장 상태**: ${{ needs.check-trading-conditions.outputs.market_phase }}" >> $GITHUB_STEP_SUMMARY
        echo "**⚡ 거래 단계**: ${{ needs.check-trading-conditions.outputs.trading_phase }}" >> $GITHUB_STEP_SUMMARY
        echo "**📊 수집 주기**: ${{ needs.check-trading-conditions.outputs.collection_frequency }}" >> $GITHUB_STEP_SUMMARY
        echo "**🎯 실행 우선도**: ${{ needs.check-trading-conditions.outputs.execution_priority }}" >> $GITHUB_STEP_SUMMARY
        echo "**🌐 수집 결과**: ${{ needs.collect-krx-data.outputs.collection_status || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
        echo "**🔧 추출 방법**: ${{ needs.collect-krx-data.outputs.extraction_methods || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
        echo "**💾 최적화 통계**: ${{ needs.collect-krx-data.outputs.optimization_stats || 'N/A' }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        # 최적화 기능 안내
        echo "### 🚀 최적화 기능" >> $GITHUB_STEP_SUMMARY
        echo "- **중복 제거**: 거래량 0 + 가격 변화 없음 = 업데이트 생략" >> $GITHUB_STEP_SUMMARY
        echo "- **맞춤형 스케줄**: 실시간 거래시간 10분 간격, 기타 30분 간격" >> $GITHUB_STEP_SUMMARY  
        echo "- **스프레드시트 최적화**: 불필요한 행 생성 방지로 용량 절약" >> $GITHUB_STEP_SUMMARY
        echo "- **12:30 KST 알림**: 거래 마감 후 자동 일일 요약 전송" >> $GITHUB_STEP_SUMMARY
        echo "- **데이터 품질**: 실제 변화가 있는 데이터만 기록" >> $GITHUB_STEP_SUMMARY
