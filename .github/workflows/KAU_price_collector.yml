# .github/workflows/KAU_price_collector.yml
name: KRX ETS Data Collector

on:
  schedule:
    - cron: '0 1-3 * * 1-5'   # Every hour at 00 minutes (10:00, 11:00, 12:00 KST)
    - cron: '30 3 * * 1-5'    # 12:30 KST - After market close  
    - cron: '0 6 * * 1-5'     # 15:00 KST - Afternoon check
    
  workflow_dispatch:
    inputs:
      force_collection:
        description: 'Force collection (ignore trading hours)'
        required: false
        default: false
        type: boolean
      debug_mode:
        description: 'Enable debug logging'
        required: false
        default: false
        type: boolean
      test_mode:
        description: 'Test mode (no actual updates)'
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  collect-data:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests==2.31.0
        pip install gspread==5.12.0
        pip install google-auth==2.23.4
        pip install google-auth-oauthlib==1.1.0
        pip install beautifulsoup4==4.12.2
        pip install lxml==4.9.3
        pip install pandas==2.1.3
        
    - name: Check market status
      id: market_check
      run: |
        CURRENT_HOUR=$(TZ=Asia/Seoul date +%H)
        CURRENT_MINUTE=$(TZ=Asia/Seoul date +%M)
        CURRENT_TIME="${CURRENT_HOUR}:${CURRENT_MINUTE}"
        CURRENT_DAY=$(TZ=Asia/Seoul date +%u)
        CURRENT_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
        
        echo "current_time=${CURRENT_TIME}" >> $GITHUB_OUTPUT
        echo "current_hour=${CURRENT_HOUR}" >> $GITHUB_OUTPUT
        echo "current_date=${CURRENT_DATE}" >> $GITHUB_OUTPUT
        
        IS_WEEKDAY="false"
        if [ "${CURRENT_DAY}" -le 5 ]; then
          IS_WEEKDAY="true"
        fi
        echo "is_weekday=${IS_WEEKDAY}" >> $GITHUB_OUTPUT
        
        IS_TRADING_HOURS="false"
        MARKET_PHASE="closed"
        
        if [ "${IS_WEEKDAY}" = "true" ]; then
          if [ "${CURRENT_HOUR}" -ge 10 ] && [ "${CURRENT_HOUR}" -lt 12 ]; then
            IS_TRADING_HOURS="true"
            MARKET_PHASE="trading"
          elif [ "${CURRENT_HOUR}" -eq 12 ] && [ "${CURRENT_MINUTE}" -lt 30 ]; then
            MARKET_PHASE="just_closed"
          elif [ "${CURRENT_HOUR}" -eq 9 ]; then
            MARKET_PHASE="pre_trading"
          else
            MARKET_PHASE="post_trading"
          fi
        fi
        
        echo "is_trading_hours=${IS_TRADING_HOURS}" >> $GITHUB_OUTPUT
        echo "market_phase=${MARKET_PHASE}" >> $GITHUB_OUTPUT
        
        echo "Current time: ${CURRENT_TIME} KST"
        echo "Date: ${CURRENT_DATE}"
        echo "Market phase: ${MARKET_PHASE}"
        echo "Trading hours: ${IS_TRADING_HOURS}"

    - name: Verify environment variables
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
      run: |
        if [ -z "$GOOGLE_SHEETS_CREDS" ]; then
          echo "ERROR: GOOGLE_SHEETS_CREDS not found"
          exit 1
        fi
        
        if [ -z "$KAU_SHEET_ID" ]; then
          echo "ERROR: KAU_SHEET_ID not found"
          exit 1
        fi
        
        echo "Environment variables verified"

    - name: Check trading hours and execute
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        MARKET_PHASE: ${{ steps.market_check.outputs.market_phase }}
        DEBUG_MODE: ${{ github.event.inputs.debug_mode }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: |
        echo "Market phase: ${{ steps.market_check.outputs.market_phase }}"
        echo "Current time: ${{ steps.market_check.outputs.current_time }} KST"
        echo "Trading hours: ${{ steps.market_check.outputs.is_trading_hours }}"
        echo "Debug mode: ${{ github.event.inputs.debug_mode }}"
        echo "Test mode: ${{ github.event.inputs.test_mode }}"
        
        # Skip on weekends
        if [ "${{ steps.market_check.outputs.is_weekday }}" = "false" ]; then
          echo "Skipping: Weekend"
          exit 0
        fi
        
        # Check trading hours unless forced
        if [ "${{ github.event.inputs.force_collection }}" != "true" ]; then
          case "${{ steps.market_check.outputs.market_phase }}" in
            "closed")
              echo "Skipping: Market closed"
              exit 0
              ;;
            "trading"|"just_closed"|"post_trading")
              echo "Proceeding: Active trading period"
              ;;
            *)
              echo "Proceeding: Limited collection"
              ;;
          esac
        else
          echo "Force collection mode enabled"
        fi
        
        # Execute the Python script
        echo "Starting KRX data collection..."
        python KAU_price_collector.py

    - name: Run analysis script
      if: always()
      env:
        GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
        KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
        TEST_MODE: ${{ github.event.inputs.test_mode }}
      run: |
        if [ "$TEST_MODE" = "true" ]; then
          echo "Test mode: Skipping analysis"
          exit 0
        fi
        
        echo "Running analysis script..."
        if [ -f "analyze_results.py" ]; then
          python analyze_results.py
        else
          echo "Analysis script not found, skipping detailed analysis"
        fi

    - name: Generate summary
      if: always()
      run: |
        echo "## KRX ETS Data Collection Results" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        echo "**Execution Time**: ${{ steps.market_check.outputs.current_time }} KST" >> $GITHUB_STEP_SUMMARY
        echo "**Date**: ${{ steps.market_check.outputs.current_date }}" >> $GITHUB_STEP_SUMMARY
        echo "**Market Phase**: ${{ steps.market_check.outputs.market_phase }}" >> $GITHUB_STEP_SUMMARY
        echo "**Trading Hours**: ${{ steps.market_check.outputs.is_trading_hours }}" >> $GITHUB_STEP_SUMMARY
        echo "**Debug Mode**: ${{ github.event.inputs.debug_mode }}" >> $GITHUB_STEP_SUMMARY
        echo "**Test Mode**: ${{ github.event.inputs.test_mode }}" >> $GITHUB_STEP_SUMMARY
        echo "" >> $GITHUB_STEP_SUMMARY
        
        if [ $? -eq 0 ]; then
          echo "**Status**: Success" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Trading Schedule" >> $GITHUB_STEP_SUMMARY
          echo "- **Trading Hours**: 10:00-12:00 KST (Weekdays)" >> $GITHUB_STEP_SUMMARY
          echo "- **Collection Frequency**: Every 5 minutes during trading" >> $GITHUB_STEP_SUMMARY
          echo "- **Post-Market**: 12:30 KST" >> $GITHUB_STEP_SUMMARY
          echo "- **Afternoon Check**: 15:00 KST" >> $GITHUB_STEP_SUMMARY
        else
          echo "**Status**: Failed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Troubleshooting" >> $GITHUB_STEP_SUMMARY
          echo "- Check KRX website accessibility" >> $GITHUB_STEP_SUMMARY
          echo "- Verify Google Sheets API credentials" >> $GITHUB_STEP_SUMMARY
          echo "- Run with debug mode for detailed logs" >> $GITHUB_STEP_SUMMARY
        fi
        
        if [ $? -eq 0 ]; then
          echo "::notice::KRX data collection completed successfully"
        else
          echo "::warning::KRX data collection failed"
        fi
