# NGMS Data Update Workflow
# 국가온실가스종합관리시스템 데이터 월간 업데이트

name: NGMS Data Update

on:
  # 매월 1일 오전 9시 (KST) 실행 = UTC 0시
  schedule:
    - cron: '0 0 1 * *'
  
  # 수동 실행 가능
  workflow_dispatch:
    inputs:
      debug_mode:
        description: 'Enable debug mode (saves screenshots and HTML)'
        required: false
        default: 'false'
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  update-ngms-data:
    name: Update NGMS Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements/requirements_NGMS.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/requirements_NGMS.txt
      
      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium
      
      - name: Run NGMS Data Update
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
        run: |
          cd KAU_participant
          python main.py
      
      - name: Upload debug artifacts
        if: failure() || github.event.inputs.debug_mode == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: debug-artifacts-${{ github.run_number }}
          path: |
            KAU_participant/debug/
            /tmp/**/debug/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Create summary
        if: always()
        run: |
          echo "## NGMS Data Update Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Run Date**: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: ${{ env.PYTHON_VERSION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Debug Mode**: ${{ github.event.inputs.debug_mode || 'false' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Data Types Updated" >> $GITHUB_STEP_SUMMARY
          echo "- 할당대상업체 (ETS Allocation Targets)" >> $GITHUB_STEP_SUMMARY
          echo "- 목표관리대상업체 (Target Management Companies)" >> $GITHUB_STEP_SUMMARY
          echo "- 명세서배출량통계 (Emission Statistics)" >> $GITHUB_STEP_SUMMARY

  notify-on-failure:
    name: Notify on Failure
    runs-on: ubuntu-latest
    needs: update-ngms-data
    if: failure()
    
    steps:
      - name: Create issue on failure
        uses: actions/github-script@v7
        with:
          script: |
            const title = `NGMS Data Update Failed - ${new Date().toISOString().split('T')[0]}`;
            const body = `
            ## NGMS Data Update Workflow Failed
            
            - **Workflow Run**: [${context.runId}](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId})
            - **Date**: ${new Date().toISOString()}
            - **Branch**: ${context.ref}
            
            Please check the workflow logs for details.
            `;
            
            // Check if similar issue exists
            const issues = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'ngms-update-failure'
            });
            
            if (issues.data.length === 0) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title: title,
                body: body,
                labels: ['ngms-update-failure', 'automated']
              });
            }
