# .github/workflows/update_allocation_data.yml
# ETRS 배출권 할당 데이터 자동 수집 및 Google Sheets 업데이트

name: Update ETRS Allocation Data

on:
  # 매주 월요일 오전 9시 (KST) = 일요일 자정 (UTC)
  schedule:
    - cron: '0 0 * * 1'
  
  # 수동 실행
  workflow_dispatch:

env:
  PYTHON_VERSION: '3.11'

jobs:
  collect-etrs:
    name: ETRS 데이터 수집
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      
      - name: Install dependencies
        run: |
          pip install requests pandas openpyxl xlrd gspread google-auth
      
      - name: Collect ETRS data
        run: |
          cd KAU_allocation
          python main.py
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: etrs-data
          path: KAU_allocation/data/*.xlsx
          retention-days: 30
