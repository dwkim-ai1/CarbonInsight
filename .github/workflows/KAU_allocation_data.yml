# .github/workflows/update_allocation_data.yml
# ETRS/ORS 배출권/상쇄 데이터 자동 수집 및 Google Sheets 업데이트
# 총 32개 시트 관리: 16개 데이터셋 × 2(최신+이력)

# ★★★ 변경사항 (v1.1) ★★★
# - current_year_only 옵션 추가: 현재 연도만 수집
# - 자동 실행(schedule): 기본적으로 현재 연도만 수집 (incremental mode)
# - 수동 실행: 전체 수집 또는 현재 연도만 수집 선택 가능

name: 03_ETRS/ORS_Data_updater

on:
  # 매주 월요일 오전 9시 (KST) = 일요일 자정 (UTC)
  schedule:
    - cron: '0 0 2 * *'
  
  # 수동 실행
  workflow_dispatch:
    inputs:
      data_source:
        description: '수집할 데이터 소스'
        required: true
        default: 'all'
        type: choice
        options:
          - all          # ETRS + ORS 전체
          - etrs_only    # ETRS만
          - ors_only     # ORS만
      
      etrs_periods:
        description: 'ETRS 계획기간 (쉼표 구분)'
        required: false
        default: '1,2,3'
        type: string
      
      current_year_only:
        description: '현재 연도만 수집 (자동 수집 모드)'
        required: false
        default: false
        type: boolean
      
      debug_mode:
        description: '디버그 모드'
        required: false
        default: false
        type: boolean

env:
  PYTHON_VERSION: '3.11'

jobs:
  collect-allocation-data:
    name: 배출권/상쇄 데이터 수집
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: 'requirements/requirements_NGMS.txt'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip  
          pip install -r requirements/requirements_NGMS.txt
          playwright install chromium
          playwright install-deps chromium
      
      - name: Create debug directory
        if: ${{ github.event.inputs.debug_mode == 'true' }}
        run: mkdir -p /tmp/allocation_debug
      
      - name: Run data collection
        run: |
          cd KAU_allocation
          python main.py
        env:
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          KAU_SHEET_ID: ${{ secrets.KAU_SHEET_ID }}
          ETRS_ONLY: ${{ github.event.inputs.data_source == 'etrs_only' && 'true' || 'false' }}
          ORS_ONLY: ${{ github.event.inputs.data_source == 'ors_only' && 'true' || 'false' }}
          ETRS_PERIODS: ${{ github.event.inputs.etrs_periods || '1,2,3' }}
          # ★★★ 자동 수집(schedule)에서는 기본적으로 현재 연도만 수집 ★★★
          # 수동 실행에서는 사용자 선택에 따름
          CURRENT_YEAR_ONLY: ${{ github.event_name == 'schedule' && 'true' || github.event.inputs.current_year_only || 'false' }}
          DEBUG_MODE: ${{ github.event.inputs.debug_mode || 'false' }}
          DEBUG_DIR: /tmp/allocation_debug
      
      - name: Upload debug artifacts
        if: ${{ always() && github.event.inputs.debug_mode == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: /tmp/allocation_debug/
          retention-days: 7
          if-no-files-found: ignore
      
      - name: Upload data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allocation-data
          path: KAU_allocation/data/*.xlsx
          retention-days: 30
          if-no-files-found: ignore

  summary:
    name: 실행 결과 요약
    runs-on: ubuntu-latest
    needs: [collect-allocation-data]
    if: always()
    
    steps:
      - name: Check results
        run: |
          echo "====================================="
          echo "ETRS/ORS 데이터 수집 결과"
          echo "====================================="
          echo ""
          echo "수집 작업: ${{ needs.collect-allocation-data.result }}"
          echo "실행 트리거: ${{ github.event_name }}"
          echo ""
          
          if [ "${{ github.event_name }}" == "schedule" ]; then
            echo "📅 자동 수집 모드: 현재 연도만 수집"
          else
            echo "🔧 수동 실행 모드"
            echo "   - 현재 연도만: ${{ github.event.inputs.current_year_only }}"
          fi
          echo ""
          
          if [ "${{ needs.collect-allocation-data.result }}" == "success" ]; then
            echo "✅ 데이터 수집 완료"
          elif [ "${{ needs.collect-allocation-data.result }}" == "failure" ]; then
            echo "❌ 데이터 수집 실패"
            exit 1
          else
            echo "⚠️ 데이터 수집 상태: ${{ needs.collect-allocation-data.result }}"
          fi
