name: DART utilization time-series collector
on:
  schedule:
    - cron: '0 0 1 4 *'
    - cron: '0 0 20 5 *'
    - cron: '0 0 1 9 *'
    - cron: '0 0 20 11 *'
  workflow_dispatch:
    inputs:
      target_shard: {description: '특정 시트 (1~10 또는 all)', default: all, type: string}
      years_back: {description: '수집 연수', default: '10', type: string}
      test_mode: {description: '저장 없는 dry-run', default: false, type: boolean}
      debug_mode: {description: '상세 로그와 실패 HTML', default: false, type: boolean}
      force_reprocess: {description: '기수집 데이터 재처리', default: false, type: boolean}
      send_telegram: {description: '텔레그램 강제 전송', default: false, type: boolean}
jobs:
  collect:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python -m pip install --no-cache-dir -r requirements/collector.txt
      - name: Collect utilization
        run: python utilization_collector.py 2>&1 | tee utilization.log
        env:
          opendart_api: ${{ secrets.opendart_api }}
          GOOGLE_SHEETS_CREDS: ${{ secrets.GOOGLE_SHEETS_CREDS }}
          gspread_list: ${{ secrets.gspread_list }}
          gspread_ids: ${{ secrets.gspread_ids }}
          OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
          TARGET_SHARD: ${{ inputs.target_shard || 'all' }}
          YEARS_BACK: ${{ inputs.years_back || '10' }}
          TEST_MODE: ${{ inputs.test_mode || 'false' }}
          DEBUG_MODE: ${{ inputs.debug_mode || 'false' }}
          FORCE_REPROCESS: ${{ inputs.force_reprocess || 'false' }}
          LLM_STRUCTURE_MODE: ${{ vars.LLM_STRUCTURE_MODE || 'true' }}
          LLM_MAX_CALLS: ${{ vars.LLM_MAX_CALLS || '240' }}
          LLM_MAX_CALLS_PER_COMPANY: ${{ vars.LLM_MAX_CALLS_PER_COMPANY || '1' }}
          LLM_VALUE_FALLBACK_MODE: ${{ vars.LLM_VALUE_FALLBACK_MODE || 'false' }}
          LLM_EXCEPTION_FALLBACK_MODE: ${{ vars.LLM_EXCEPTION_FALLBACK_MODE || 'true' }}
          LLM_EXCEPTION_MAX_CALLS: ${{ vars.LLM_EXCEPTION_MAX_CALLS || '60' }}
          LLM_EXCEPTION_MAX_CALLS_PER_COMPANY: ${{ vars.LLM_EXCEPTION_MAX_CALLS_PER_COMPANY || '1' }}
          STRUCTURED_WRITES_REQUIRE_SELECTORS: ${{ vars.STRUCTURED_WRITES_REQUIRE_SELECTORS || 'true' }}
          APPEND_RAW_ROWS: ${{ vars.APPEND_RAW_ROWS || 'false' }}
          GOOGLE_SHEETS_READ_REQUESTS_PER_MINUTE: ${{ vars.GOOGLE_SHEETS_READ_REQUESTS_PER_MINUTE || '45' }}
          GOOGLE_SHEETS_WRITE_REQUESTS_PER_MINUTE: ${{ vars.GOOGLE_SHEETS_WRITE_REQUESTS_PER_MINUTE || '30' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: utilization-debug, path: 'debug/', if-no-files-found: ignore, retention-days: 14}
  notify:
    needs: collect
    if: always()
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: pip install requests
      - run: python utilization_notifier.py
        env:
          CARBON_TOKEN: ${{ secrets.CARBON_TOKEN }}
          ESG_TESTER: ${{ secrets.ESG_TESTER }}
          COLLECT_STATUS: ${{ needs.collect.result }}
          SEND_TELEGRAM: ${{ inputs.send_telegram || 'false' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
